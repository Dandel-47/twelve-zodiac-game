  `);
}

function mode2BanPick(idx) {
  if (G.inputLocked) return;
  lockInput();
  sfx('special');
  const m2 = G.m2;
  m2.aiBanned.push(idx);
  log(`玩家禁用了AI的 ${ZODIAC[idx].emoji} ${ZODIAC[idx].name}`, 'player');
  updateMode2Rosters();
  hideOverlay();
  setTimeout(()=>mode2BanRPS(), 800);
}

function mode2AIBanPick() {
  const m2 = G.m2;
  // AI bans a strong player character
  const available = m2.playerTeam.filter(i => !m2.playerBanned.includes(i));
  // Ban the highest level one
  const sorted = [...available].sort((a,b) => b - a);
  const ban = sorted[0];
  m2.playerBanned.push(ban);
  log(`AI禁用了玩家的 ${ZODIAC[ban].emoji} ${ZODIAC[ban].name}`, 'ai');
  sfx('special');
  updateMode2Rosters();
  setTimeout(()=>mode2BanRPS(), 800);
}

function mode2StartDeployPhase() {
  const m2 = G.m2;
  m2.phase = 'deploy_rps';
  log('排兵布阵阶段：先进行RPS，胜者为红方', 'system');
  mode2DeployRPS();
}

function mode2DeployRPS() {
  const m2 = G.m2;
  unlockInput();
  showActionArea(`
    <span class="prompt-text">排兵布阵 · 选择出招（胜者=红方，败者=蓝方）：</span>
    <button class="rps-btn" onclick="mode2DeployRPSResolve('rock')">✊</button>
    <button class="rps-btn" onclick="mode2DeployRPSResolve('paper')">✋</button>
    <button class="rps-btn" onclick="mode2DeployRPSResolve('scissors')">✌️</button>
  `);
}

function mode2DeployRPSResolve(choice) {
  sfx('rps');
  document.querySelectorAll('.rps-btn').forEach(btn => btn.disabled = true);
  const aiChoice = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
  const beats = {rock:'scissors', paper:'rock', scissors:'paper'};

  const pEl = document.getElementById('player-rps');
  const aEl = document.getElementById('ai-rps');
  pEl.textContent = RPS[choice];
  aEl.textContent = RPS[aiChoice];
  pEl.classList.add('show');
  setTimeout(()=>aEl.classList.add('show'), 300);

  setTimeout(()=>{
    pEl.classList.remove('show');
    aEl.classList.remove('show');

    if (choice === aiChoice) {
      log('排兵RPS平局，再来一次', 'info');
      mode2DeployRPS();
      return;
    }

    const playerWins = beats[choice] === aiChoice;
    const m2 = G.m2;
    m2.deployIsPlayerRed = playerWins;
    // Draft order: R(1) B(2) R(2) B(2) R(1) = 8 picks, 4 each
    m2.deployOrder = [];
    const red = playerWins ? 'player' : 'ai';
    const blue = playerWins ? 'ai' : 'player';
    m2.deployOrder.push({side: red, count: 1});
    m2.deployOrder.push({side: blue, count: 2});
    m2.deployOrder.push({side: red, count: 2});
    m2.deployOrder.push({side: blue, count: 2});
    m2.deployOrder.push({side: red, count: 1});
    m2.deployStep = 0;

    log(`${playerWins?'玩家':'AI'}为红方，${playerWins?'AI':'玩家'}为蓝方`, 'system');
    log('选秀顺序：红1→蓝2→红2→蓝2→红1', 'system');

    m2.phase = 'deploy_pick';
    mode2DeployNext();
  }, 1200);
}

function mode2DeployNext() {
  const m2 = G.m2;
  if (m2.deployStep >= m2.deployOrder.length) {
    log('排兵布阵完成！双方各4名角色', 'system');
    mode2StartBattle();
    return;
  }

  const step = m2.deployOrder[m2.deployStep];
  const isPlayerTurn = step.side === 'player';

  // Build draft order display
  let orderHtml = '<div class="draft-order">';
  for (let i = 0; i < m2.deployOrder.length; i++) {
    const s = m2.deployOrder[i];
    const isRed = s.side === (m2.deployIsPlayerRed ? 'player' : 'ai');
    let cls = isRed ? 'step red' : 'step blue';
    if (i < m2.deployStep) cls += ' done';
    if (i === m2.deployStep) cls += ' current';
    const label = isRed ? '红' : '蓝';
    orderHtml += `<span class="${cls}">${label}×${s.count}</span>`;
  }
  orderHtml += '</div>';

  if (isPlayerTurn) {
    mode2DeployShowPlayer(orderHtml, step.count);
  } else {
    showOverlay(`
      <h2>AI排兵中...</h2>
      ${orderHtml}
      <p style="color:var(--dim)">AI正在选择角色...</p>
    `);
    setTimeout(()=>mode2AIDeployPick(step.count), 1200);
  }
}

function mode2DeployShowPlayer(orderHtml, count) {
  unlockInput();
  const m2 = G.m2;
  // Always rebuild draft order if not provided
  if (!orderHtml) {
    orderHtml = '<div class="draft-order">';
    for (let i = 0; i < m2.deployOrder.length; i++) {
      const s = m2.deployOrder[i];
      const isRed = s.side === (m2.deployIsPlayerRed ? 'player' : 'ai');
      let cls = isRed ? 'step red' : 'step blue';
      if (i < m2.deployStep) cls += ' done';
      if (i === m2.deployStep) cls += ' current';
      const label = isRed ? '红' : '蓝';
      orderHtml += `<span class="${cls}">${label}×${s.count}</span>`;
    }
    orderHtml += '</div>';
  }
  const available = m2.playerTeam.filter(i => !m2.playerBanned.includes(i) && !m2.playerDeployed.includes(i));
  let cards = '';
  available.forEach(idx => {
    cards += `<div class="animal-card selectable" onclick="mode2DeployPick(${idx})">
      <span class="emoji">${ZODIAC[idx].emoji}</span>
      <span class="name">${ZODIAC[idx].name}</span>
    </div>`;
  });

  showOverlay(`
    <h2>排兵布阵 · 已选${m2.playerDeployed.length}/4</h2>
    ${orderHtml}
    <p style="color:var(--cyan)">本次还需选${count}名</p>
    <div class="select-grid">${cards}</div>
  `);
}

function mode2DeployPick(idx) {
  if (G.inputLocked) return;
  lockInput();
  sfx('click');
  const m2 = G.m2;
  if (m2.playerDeployed.includes(idx)) return;
  m2.playerDeployed.push(idx);
  log(`玩家派出 ${ZODIAC[idx].emoji} ${ZODIAC[idx].name} (第${m2.playerDeployed.length}位)`, 'player');
  updateMode2Rosters();

  const step = m2.deployOrder[m2.deployStep];
  const picksNeeded = step.count;
  const playerPicksInStep = countPicksInStep(m2, m2.deployStep, 'player');
  if (playerPicksInStep < picksNeeded) {
    const remaining = picksNeeded - playerPicksInStep;
    mode2DeployShowPlayer(null, remaining);
  } else {
    m2.deployStep++;
    setTimeout(()=>mode2DeployNext(), 600);
  }
}

function getPicksBeforeStep(step, side) {
  let count = 0;
  for (let i = 0; i < step; i++) {
    if (G.m2.deployOrder[i].side === side) count += G.m2.deployOrder[i].count;
  }
  return count;
}

function countPicksInStep(m2, step, side) {
  if (m2.deployOrder[step].side !== side) return 0;
  const before = getPicksBeforeStep(step, side);
  const deployed = side === 'player' ? m2.playerDeployed.length : m2.aiDeployed.length;
  return deployed - before;
}

function mode2AIDeployPick(count) {
  const m2 = G.m2;
  const available = m2.aiTeam.filter(i => !m2.aiBanned.includes(i) && !m2.aiDeployed.includes(i));
  // AI picks: somewhat strategic - mix of strong and strategic
  const sorted = [...available].sort(() => Math.random() - 0.5);

  for (let i = 0; i < count && sorted.length > 0; i++) {
    const pick = sorted.shift();
    m2.aiDeployed.push(pick);
    log(`AI派出 ${ZODIAC[pick].emoji} ${ZODIAC[pick].name} (第${m2.aiDeployed.length}位)`, 'ai');
  }

  updateMode2Rosters();
  m2.deployStep++;
  setTimeout(()=>mode2DeployNext(), 800);
}

function mode2StartBattle() {
  hideOverlay();
  const m2 = G.m2;
  m2.phase = 'battle';
  m2.player.currentIdx = 0;
  m2.ai.currentIdx = 0;
  m2.player.dead = [];
  m2.ai.dead = [];

  log('=== 团队战开始 ===', 'system');
  log(`玩家阵容: ${m2.playerDeployed.map(i => ZODIAC[i].emoji+ZODIAC[i].name).join(' → ')}`, 'player');
  log(`AI阵容: ${m2.aiDeployed.map(i => ZODIAC[i].emoji+ZODIAC[i].name).join(' → ')}`, 'ai');

  // Set up first fighters - set levels first, then HP
  G.player.level = m2.playerDeployed[0];
  G.ai.level = m2.aiDeployed[0];
  resetForNewGame(G.player);
  resetForNewGame(G.ai);
  setupHpForNewGame(G.player, G.ai);
  setupHpForNewGame(G.ai, G.player);
  // Set monkey form for monkey fighters
  if (ZODIAC[G.player.level].name === '猴') G.player.monkeyForm = 'calm';
  if (ZODIAC[G.ai.level].name === '猴') G.ai.monkeyForm = 'calm';
  log(`玩家派出 ${ZODIAC[G.player.level].emoji} ${ZODIAC[G.player.level].name} 上场！`, 'player');
  log(`AI派出 ${ZODIAC[G.ai.level].emoji} ${ZODIAC[G.ai.level].name} 上场！`, 'ai');
  sfx('levelup');

  G.round = 0;
  G.battleEnded = false;
  updateMode2Rosters();
  updateUI();

  // AI snake awakening (handled before player check so it's not skipped)
  const aiAnimal = ZODIAC[G.ai.level];
  if (aiAnimal.name === '蛇') {
    G.ai.snakeAwakened = Math.random() < 0.4;
    G.ai.maxPoison = G.ai.snakeAwakened ? 3 : 2;
    if (G.ai.snakeAwakened) {
      G.ai.maxHp = 6; G.ai.hp = 6;
      log('AI蛇进入觉醒状态', 'ai');
    }
  }

  // Player snake awakening
  const pAnimal = ZODIAC[G.player.level];
  if (pAnimal.name === '蛇') {
    showSnakeAwakeningChoice();
    return;
  }

  setTimeout(()=>beginRound(), 1500);
}

function setupMode2Fighter(playerObj, teamState, opponentObj) {
  const deployed = playerObj.isAI ? G.m2.aiDeployed : G.m2.playerDeployed;
  const idx = deployed[teamState.currentIdx];
  playerObj.level = idx;
  resetForNewGame(playerObj);
  const oppIdx = opponentObj.level !== undefined ? opponentObj.level : deployed[teamState.currentIdx];
  setupHpForNewGame(playerObj, opponentObj);
  log(`${playerObj.isAI?'AI':'玩家'}派出 ${ZODIAC[idx].emoji} ${ZODIAC[idx].name} 上场！`, playerObj.isAI?'ai':'player');
  sfx('levelup');
}

function mode2FighterDeath(deadFighter, killer) {
  // This is called from checkDeath when a fighter dies
  const m2 = G.m2;
  const teamState = deadFighter.isAI ? m2.ai : m2.player;
  teamState.dead.push(teamState.currentIdx);
  log(`${ZODIAC[deadFighter.level].emoji} ${ZODIAC[deadFighter.level].name} (${deadFighter.isAI?'AI':'玩家'})阵亡！`, 'special');
  sfx('hit');
}

function mode2HandleBattleEnd() {
  // Defensive: hide any leftover overlay and clear action area
  hideOverlay();
  showActionArea('');

  const m2 = G.m2;
  if (!G.winner) {
    console.error('mode2HandleBattleEnd: G.winner is null!');
    return;
  }
  const loser = G.winner === G.player ? G.ai : G.player;
  const loserTeam = loser.isAI ? m2.ai : m2.player;
  const loserDeployed = loser.isAI ? m2.aiDeployed : m2.playerDeployed;
  const winnerTeam = G.winner.isAI ? m2.ai : m2.player;
  const winnerName = G.winner.isAI ? 'AI' : '玩家';
  const loserName = loser.isAI ? 'AI' : '玩家';
  const winner = G.winner;

  // Safety: if winner also died, restore to 1 HP
  if (winner.hp <= 0) {
    winner.hp = 1;
    log(`${winnerName}险胜！(HP:1)`, 'win');
  }

  // Check if loser has more fighters
  if (loserTeam.currentIdx < loserDeployed.length - 1) {
    // Bring in the next fighter
    loserTeam.currentIdx++;
    log(`${loserName}派出替补：${ZODIAC[loserDeployed[loserTeam.currentIdx]].emoji} ${ZODIAC[loserDeployed[loserTeam.currentIdx]].name}`, loser.isAI?'ai':'player');
    sfx('levelup');

    // Clear winner's temporary status from the dead fighter
    if (winner.isHanging) {
      winner.isHanging = false;
      log(`${winnerName}的上吊状态随敌方阵亡而解除`, 'info');
    }
    if (winner.poisonMarks > 0) {
      winner.poisonMarks = 0;
      log(`${winnerName}的毒印记随敌方阵亡而清除`, 'info');
    }
    if (winner.isAirborne) {
      winner.isAirborne = false;
    }
    winner.oppressedNext = false;
    winner.oppressedActive = false;

    // Set up the new fighter - same pattern as mode2StartBattle
    loser.level = loserDeployed[loserTeam.currentIdx];
    resetForNewGame(loser);
    setupHpForNewGame(loser, winner);
    // Set monkey form for monkey fighters
    if (ZODIAC[loser.level].name === '猴') loser.monkeyForm = 'calm';
    log(`${loserName}派出 ${ZODIAC[loser.level].emoji} ${ZODIAC[loser.level].name} 上场！`, loser.isAI?'ai':'player');

    G.battleEnded = false;
    G.round = 0;
    updateMode2Rosters();
    updateUI();

    // Check if the new fighter is a snake (awakening choice)
    const newFighterAnimal = ZODIAC[loser.level];
    if (newFighterAnimal.name === '蛇' && !loser.isAI) {
      showSnakeAwakeningChoice();
      return;
    }
    // AI snake awakening
    if (newFighterAnimal.name === '蛇' && loser.isAI) {
      loser.snakeAwakened = Math.random() < 0.4;
      loser.maxPoison = loser.snakeAwakened ? 3 : 2;
      if (loser.snakeAwakened) {
        loser.maxHp = 6; loser.hp = 6;
        log('AI蛇进入觉醒状态', 'ai');
      }
    }

    setTimeout(()=>beginRound(), 1500);
  } else {
    // All fighters dead, the other side wins
    sfx(G.winner === G.player ? 'win' : 'lose');
    log(`=== ${winnerName}团队获胜！ ===`, 'win');
    log(`${loserName}四名角色全部阵亡`, 'special');
    const winnerDeployedArr = G.winner.isAI ? m2.aiDeployed : m2.playerDeployed;
    showOverlay(`
      <h2 style="color:var(--green)">团队对战结束！</h2>
      <p style="font-size:1.8em;">${winnerName} 获胜！</p>
      <p style="color:var(--dim);margin:15px 0;">
        ${winnerName}方剩余：${winnerDeployedArr.length - winnerTeam.currentIdx}名角色
      </p>
      <div class="btn-row">
        <button class="neon-btn" onclick="restartGame()">再来一局</button>
      </div>
    `);
    unlockInput();
  }
}

function updateMode2Rosters() {
  if (!G.m2) return;
  const m2 = G.m2;

  // Player roster
  let pHtml = '';
  if (m2.playerTeam.length > 0) {
    const team = m2.phase === 'battle' || m2.phase === 'deploy_pick' || m2.phase === 'deploy_rps' ? m2.playerDeployed : m2.playerTeam;
    team.forEach((idx, i) => {
      const banned = m2.playerBanned.includes(idx);
      const isDeployed = m2.playerDeployed.includes(idx);
      const isDead = m2.player.dead.includes(i);
      const isCurrent = m2.phase === 'battle' && i === m2.player.currentIdx;
      let cls = 'roster-slot';
      if (banned) cls += ' banned';
      else if (isDead) cls += ' dead';
      else if (isCurrent) cls += ' current';
      else cls += ' alive';
      pHtml += `<div class="${cls}" style="border-color:${isCurrent?'var(--cyan)':isDead?'#444':'var(--green)'}">
        ${ZODIAC[idx].emoji}
        ${isDeployed || m2.phase === 'battle' ? `<span class="slot-num">${i+1}</span>` : ''}
      </div>`;
    });
  }
  document.getElementById('player-roster').innerHTML = pHtml;

  // AI roster
  let aHtml = '';
  if (m2.aiTeam.length > 0) {
    const team = m2.phase === 'battle' || m2.phase === 'deploy_pick' || m2.phase === 'deploy_rps' ? m2.aiDeployed : m2.aiTeam;
    team.forEach((idx, i) => {
      const banned = m2.aiBanned.includes(idx);
      const isDeployed = m2.aiDeployed.includes(idx);
      const isDead = m2.ai.dead.includes(i);
      const isCurrent = m2.phase === 'battle' && i === m2.ai.currentIdx;
      let cls = 'roster-slot';
      if (banned) cls += ' banned';
      else if (isDead) cls += ' dead';
      else if (isCurrent) cls += ' current';
      else cls += ' alive';
      aHtml += `<div class="${cls}" style="border-color:${isCurrent?'var(--pink)':isDead?'#444':'var(--orange)'}">
        ${ZODIAC[idx].emoji}
        ${isDeployed || m2.phase === 'battle' ? `<span class="slot-num">${i+1}</span>` : ''}
      </div>`;
    });
  }
  document.getElementById('ai-roster').innerHTML = aHtml;
}

// Update UI periodically
setInterval(() => { if (G) { updateUI(); if (G.m2) updateMode2Rosters(); } }, 500);

// Initialize
initGame();
</script>
